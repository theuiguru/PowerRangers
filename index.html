<!DOCTYPE html><html><head><title>Power Rangers</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Chris Thomas">
<meta name="description" content="A New and Improved Power Rangers Database App">
<meta name="keywords" content="powerRangers, power, rangers, PowerRangers, powerrangers, saga, api, database, data, MorphinTime">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"><style>
header {background:#000 url(./assets/images/powerrangers-logo.png) no-repeat top fixed; background-size:50%; height:250px;}
main {display:grid; grid-template-columns:repeat(2, 2fr);}
aside {background:#000 url(./assets/images/logo.png) no-repeat; height:100vh;}
section {background:#202020;}
.card-body {background:#263238; color:#fff;}
footer {text-align:center; padding:20px; background:#263238; color:#fff;}
footer a, footer a:hover {color:#00E676;}
@media(max-width:900px) { header {height:100px;} main {display:block;} aside {display:none;} section {height:100vh;} }
</style></head><body><main><aside></aside><section class="d-flex justify-content-center align-items-center"><div class="container"><form><input type="text" id="search" name="search" class="form-control form-control-lg" autocomplete="off" placeholder="Search saga..."></form><div id="match-list"></div></div></section></main>
<footer>&copy; <span class="year"></span> <a href="https://powerrangers.fandom.com" target="_blank">#GoGo</a>!</footer><script>
const year = document.querySelector('.year').textContent = new Date().getFullYear();
const search = document.getElementById("search");
const matchList = document.getElementById("match-list");
const searchRangers = async searchText => {
  const res = await fetch('assets/saga.json')
  const rangers = await res.json();
  let matches = rangers.filter(ranger => {
    const regex = new RegExp(`^${searchText}`, 'gi');
    return ranger.name.match(regex);
  });  
  if(searchText.length === 0) {
    matches = [];
    matchList.innerHTML = '';
  }
  outputHtml(matches);
}
const outputHtml = matches => {
  if(matches.length > 0) {
    const html = matches.map(match => `
      <div class="card card-body mb-1">
        <h4><span class="text-success">Season ${match.id}</span>: ${match.name} (<span class="text-warning">${match.start_year}</span>)</h4>
        <p class="fs-6">No. of Characters: <span class="text-danger">${match.characters.length}</span></p>
      </div>
    `).join('');
    matchList.innerHTML = html;
  }
};
search.addEventListener("input", () => searchRangers(search.value));
</script></body></html>
